<title>HP66 Reader 隐私政策</title>
<h1>隐私政策</h1>
<p>本应用仅供所有者个人使用。</p>
<p>经所有者授权，本应用通过 Google Drive API
读取文件及其元数据，用于电子书管理和下载；
并上传所有者选择的文件及加密数据库备份。</p>
<p>相关文件、配置和运行日志保存在所有者控制的服务器
及 Google Drive 中。本应用不出售 Google 用户数据，
不将其用于广告，也不向其他用户公开。</p>
<p>所有者可以在 Google 账号的第三方应用权限页面撤销授权。
撤销授权不会自动删除已经下载的文件或已有备份，
这些数据由所有者自行管理和删除。</p>
